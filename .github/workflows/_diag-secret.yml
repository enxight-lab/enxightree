# 일회용 진단 — CLOUDFLARE_API_TOKEN 이 런타임에 실제로 보이는지만 확인한다.
# 🔒 값은 절대 출력하지 않는다. 길이와 앞 3자만 본다(마스킹이 걸려도 길이는 보인다).
# 확인 후 즉시 삭제할 것.
name: _diag-secret
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: secret 가시성 점검
        env:
          CF_TOKEN_STEP: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "job env  CF_TOKEN      길이=${#CF_TOKEN}"
          echo "step env CF_TOKEN_STEP 길이=${#CF_TOKEN_STEP}"
          echo "step env CF_ACCOUNT    길이=${#CF_ACCOUNT}"
          echo "앞 3자(형식 확인용) = ${CF_TOKEN_STEP:0:3}"

      - name: 조건식이 통과하는가 (배포 스텝과 동일한 조건)
        if: ${{ env.CF_TOKEN != '' }}
        run: echo "✅ env.CF_TOKEN != '' 통과 — 배포 스텝이 돌 조건"

      - name: 조건 실패 시
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "🔴 env.CF_TOKEN 이 비어 있다 — secret 미등록 또는 빈 값"
