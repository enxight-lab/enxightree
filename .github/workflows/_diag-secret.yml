# 일회용 진단 — CLOUDFLARE_API_TOKEN 이 런타임에 보이는지만 본다. 확인 후 삭제.
# 🔒 값은 출력하지 않는다. 길이만.
name: _diag-secret
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - run: echo "CF_TOKEN 길이=${#CF_TOKEN}"
      - name: 배포 스텝과 동일 조건
        if: ${{ env.CF_TOKEN != '' }}
        run: echo "PASS — 배포 스텝이 돈다"
      - name: 조건 실패
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "FAIL — 여전히 빈 값"
