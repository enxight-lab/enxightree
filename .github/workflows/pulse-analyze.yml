name: pulse-analyze

# 수동 전용 — pulse 이력 분포를 분석해 z-score 시그널 임계·정의를 데이터로 확정.
# 발행 파이프라인과 무관(읽기 전용 GET), Secrets 불필요.
on:
  workflow_dispatch:

# ⚠️2026-09-02 신설 — 지연 실행·수동 dispatch 가 cron 과 겹치면
#   두 런이 같은 KV·repo 를 동시에 건드리고 GDELT 를 중복 호출한다.
#   9/1 에 구·신 repo 가 같은 날 pulse 를 돌려 GDELT 스로틀을 실제로 겪었다.
#   매거진 6종과 같은 패턴 — 진행 중인 런을 죽이지 않고 대기시킨다.
concurrency:
  group: pulse-analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: pulse 이력 분포 분석
        run: python scripts/analyze_pulse_dist.py
