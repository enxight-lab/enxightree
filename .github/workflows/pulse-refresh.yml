# Market Pulse 자동 집계 (GAS 원안 → Actions 대체, docs/PULSE_SETUP.md)
# 매일 07:30 KST — Yahoo 가격 + GDELT 뉴스 밀도 + 온도차 → data.enxight.com (KV)
# git 커밋 없음 (산출물이 KV 로 감) — checkout + python 만의 경량 잡.
# Secrets: PULSE_TOKEN (+ 실패 알림용 텔레그램 2종은 data-refresh 와 공유)

name: pulse-refresh

on:
  schedule:
    - cron: "30 22 * * *" # 07:30 KST
  workflow_dispatch:

# ⚠️2026-09-02 신설 — 지연 실행·수동 dispatch 가 cron 과 겹치면
#   두 런이 같은 KV·repo 를 동시에 건드리고 GDELT 를 중복 호출한다.
#   9/1 에 구·신 repo 가 같은 날 pulse 를 돌려 GDELT 스로틀을 실제로 겪었다.
#   매거진 6종과 같은 패턴 — 진행 중인 런을 죽이지 않고 대기시킨다.
concurrency:
  group: pulse-refresh
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build & push pulse
        env:
          PULSE_TOKEN: ${{ secrets.PULSE_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
        run: python scripts/build_pulse.py

      - name: Telegram alert on failure
        if: ${{ failure() }}
        env:
          TG_TOKEN: ${{ secrets.ENXIGHT_TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.ENXIGHT_TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && { echo "no telegram secret — skip"; exit 0; }
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$TG_CHAT" \
            --data-urlencode text="🟠 Market Pulse 집계 실패 — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null