# ENXIGHT Market Pulse — 데이터 Worker (data.enxight.com)
# Apps Script(일 07:30 KST)가 POST → KV 저장 → 프론트(map.enxight.com/pulse)가 GET.
# 시크릿: PULSE_TOKEN (`npx wrangler secret put PULSE_TOKEN` — GAS 스크립트 속성과 동일 값)
# 배포: 이 디렉터리에서 `npx wrangler deploy`

name = "enxight-pulse"
main = "index.js"
compatibility_date = "2024-11-06"

routes = [
  { pattern = "data.enxight.com", custom_domain = true }
]

[[kv_namespaces]]
binding = "PULSE_KV"
id = "cccf3773fc0f40a895228ea3e39cb6a1"

# 외부 heartbeat (2026-09-02 신설) — GitHub Actions 밖에서 도는 유일한 감시.
# 03:00 UTC = 12:00 KST — data-refresh(06:00)·pulse-refresh(07:30) 뒤,
# GHA 상시 지연 1~2h 을 감안해 여유를 둔 시각이다.
[triggers]
crons = ["0 3 * * *"]
